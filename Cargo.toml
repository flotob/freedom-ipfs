[workspace]
members = [
    "crates/freedom-ipfs-core",
    "crates/freedom-ipfs-store",
    "crates/freedom-ipfs-unixfs",
    "crates/freedom-ipfs-namesys",
    "crates/freedom-ipfs-routing",
    "crates/freedom-ipfs-retrieval",
    "crates/freedom-ipfs-gateway",
    "crates/freedom-ipfs-mobile",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flotob/freedom-ipfs"
homepage = "https://github.com/flotob/freedom-ipfs"
authors = ["Freedom IPFS contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
cid = { version = "0.11", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
futures = "0.3"
http = "1"
mime_guess = "2"
multibase = "0.9"
multihash = "0.19"
multihash-codetable = { version = "0.2", features = ["sha2"] }
parking_lot = "0.12"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unsigned-varint = "0.8"
url = "2"

freedom-ipfs-core = { path = "crates/freedom-ipfs-core" }
freedom-ipfs-store = { path = "crates/freedom-ipfs-store" }
freedom-ipfs-unixfs = { path = "crates/freedom-ipfs-unixfs" }
freedom-ipfs-namesys = { path = "crates/freedom-ipfs-namesys" }
freedom-ipfs-routing = { path = "crates/freedom-ipfs-routing" }
freedom-ipfs-retrieval = { path = "crates/freedom-ipfs-retrieval" }
freedom-ipfs-gateway = { path = "crates/freedom-ipfs-gateway" }
freedom-ipfs-mobile = { path = "crates/freedom-ipfs-mobile" }
